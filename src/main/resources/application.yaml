# Giá trị thực tế: file .env ở thư mục gốc project (đã gitignore) hoặc biến môi trường hệ thống / Docker.
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/enflow}

enflow:
  jwt:
    secret: ${ENFLOW_JWT_SECRET}
    expiration-ms: ${ENFLOW_JWT_EXPIRATION_MS:86400000}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/EnFlow}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
